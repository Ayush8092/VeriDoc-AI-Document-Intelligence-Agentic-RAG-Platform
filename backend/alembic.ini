[alembic]
# Path to migration scripts.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Timezone for migration file timestamps. Left unset (rather than an
# empty string) — newer Alembic versions pass this value straight to
# `zoneinfo.ZoneInfo`, which raises ValueError on an empty string rather
# than treating it as "no timezone" (confirmed: `alembic revision
# --autogenerate` failed outright with this line present as `timezone =`
# — a real, if minor, config bug fixed here).

# Placeholder only — actually ignored at runtime. alembic/env.py overrides
# this with app.core.config.get_settings().database_url, so DATABASE_URL
# (env var / .env) is the one real source of truth, same as the app
# itself. See alembic/env.py's module docstring.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S